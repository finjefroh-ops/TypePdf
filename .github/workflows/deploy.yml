# Baut TYPEPDF und veröffentlicht es auf GitHub Pages (Einstellungen → Pages → Quelle: GitHub Actions).
# Veröffentlicht wird vom Branch, den die Pages-Umgebung freigegeben hat
# (Settings → Environments → github-pages → Deployment branches).
name: Deploy

on:
  push:
    branches: [claude/keen-thompson-uzfhvh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
